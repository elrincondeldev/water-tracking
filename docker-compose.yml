services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      GOTA_DEVICE_TOKEN: ${GOTA_DEVICE_TOKEN:?set GOTA_DEVICE_TOKEN in .env}
    ports:
      - "3000:3000"
    volumes:
      - gota-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  gota-data:
